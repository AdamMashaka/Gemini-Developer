<!DOCTYPE HTML>
<html>
<head>
    <!-- Include your usual head content here -->
</head>
<body>
    <div id="page">
        <header id="fh5co-header">
            <!-- Include your header content here -->
        </header>

        <div id="fh5co-profile" class="fh5co-bg-section">
            <div class="container">
                <div class="row">
                    <div class="col-md-6 col-md-offset-3">
                        <h3>Welcome, {{ user.username }}!</h3>
                        <p>Email: {{ user.email }}</p>
                        <!-- Display more user information if needed -->
                    </div>
                </div>
            </div>
        </div>

        <footer id="fh5co-footer">
            <!-- Include your footer content here -->
        </footer>
    </div>

    <!-- Include your usual scripts here -->

    <!-- Chatbot Section -->
 <div id="chatbot-container" class="chatbot-container">
	<div class="chatbot-header">
		<h4>Ask Our AI Chatbot</h4>
		<button id="close-chatbot" class="btn btn-secondary">Close</button>
	</div>
	<div class="chatbot-body">
		<div id="chatbot-messages" class="chatbot-messages"></div>
		<input type="text" id="chatbot-input" placeholder="Type your question here...">
		<button id="send-button" class="btn btn-primary">Send</button>
	</div>
</div>

<!-- Chatbot Toggle Button -->
<button id="open-chatbot" class="btn btn-primary">Chat with us</button>

<!-- Include necessary scripts -->
<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/jquery.easing.1.3.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
<script src="{% static 'js/owl.carousel.min.js' %}"></script>
<script src="{% static 'js/jquery.countTo.js' %}"></script>
<script src="{% static 'js/jquery.stellar.min.js' %}"></script>
<script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
<script src="{% static 'js/magnific-popup-options.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>

<!-- Add CSS for full-page chatbot -->
<style>
	#chatbot-container {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 300px;
        height: 400px;
        background: white;
        color: black;
        z-index: 1000;
        overflow-y: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
	}

	.chatbot-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: #333;
        cursor: move; /* Indicate draggable area */
	}

	.chatbot-body {
		padding: 20px;
	}

	.chatbot-messages {
		max-height: 70vh;
		overflow-y: auto;
		margin-bottom: 10px;
	}

	.user-message {
		color: white;
	}

	#open-chatbot {
		position: fixed;
		bottom: 20px;
		right: 20px;
		z-index: 1001;
	}
</style>

<!-- Add JavaScript for chatbot functionality -->
<script>
	document.getElementById("send-button").addEventListener("click", function() {
		const userInput = document.getElementById("chatbot-input").value;
		if (userInput) {
			// Add the user's question to the chat
			const messages = document.getElementById("chatbot-messages");
			const userMessage = document.createElement("div");
			userMessage.textContent = "You: " + userInput;
			messages.appendChild(userMessage);

			// Call the Django endpoint to get the response
			fetch('/api/chatbot-api/', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify({ question: userInput }),
			})
			.then(response => response.json())
			.then(data => {
				const botMessage = document.createElement("div");
				botMessage.textContent = "Bot: " + data.answer;
				messages.appendChild(botMessage);
			})
			.catch(error => {
				console.error('Error:', error);
			});
		}
	});

	// Toggle chatbot visibility
	document.getElementById("open-chatbot").addEventListener("click", function() {
		document.getElementById("chatbot-container").style.display = "block";
		document.getElementById("open-chatbot").style.display = "none";
	});

	document.getElementById("close-chatbot").addEventListener("click", function() {
		document.getElementById("chatbot-container").style.display = "none";
		document.getElementById("open-chatbot").style.display = "block";
	});
</script>
</body>
</html>
